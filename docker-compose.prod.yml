x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: forestshop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?chyba POSTGRES_PASSWORD}
      POSTGRES_DB: forestshop
      # postgres:18+ images default PGDATA to /var/lib/postgresql/<major>/docker;
      # pin it back to the classic single-mount path so the named volume below works
      # (rovnaký dôvod ako v docker-compose.yml pre lokálny vývoj).
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forestshop"]
      interval: 10s
      timeout: 3s
      retries: 20
    logging: *default-logging

  app:
    image: ghcr.io/zbynekdrlik/forestshop-app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Doplnok k appka's vlastnému SIGTERM handleru (apps/api/src/shutdown.ts,
    # issue 78) — appka sa dnes ukončí za pár ms, ale 15s dáva rezervu pre
    # prípad pomalšieho zatvárania DB spojení pod záťažou. Toto NIE JE
    # náhrada za handler: appka bez neho SIGTERM ignorovala úplne (PID 1 bez
    # init procesu) a čakala by celých 15s pri KAŽDOM deployi namiesto pár ms.
    stop_grace_period: 15s
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://forestshop:${POSTGRES_PASSWORD}@postgres:5432/forestshop
      PORT: 3000
      SESSION_COOKIE_SECURE: "true"
      # Zámerne BEZ `:?` (na rozdiel od POSTGRES_PASSWORD/CF_TUNNEL_TOKEN nižšie) —
      # `env.ts` (F0) má SHOPTET_EXPORT_URL ako `.optional()`, appka bez neho beží,
      # len ručný import vráti 503. Bare kľúč preberá hodnotu z `/srv/forestshop/.env`,
      # KEĎ tam je; keď nie je (dnešný stav dev2), premenná sa v kontajneri vôbec
      # nenastaví — nie prázdny reťazec, ktorý by `z.string().url()` odmietol a appku
      # zhodil pri štarte. Povinný `:?` by tu pri každom deployi na dev2 padal, kým
      # operátor tajomstvo nedoplní (issue #8).
      SHOPTET_EXPORT_URL:
      CATALOG_RAW_DIR: /data/catalog-raw
      # Rovnaká úvaha ako SHOPTET_EXPORT_URL vyššie — `.optional()` v `env.ts`
      # (#21), bare kľúč preberá `/srv/forestshop/.env`, keď tam je.
      SHOPTET_ORDERS_URL:
      # issue 120: SAMOSTATNÝ XML export objednávok — jediný zdroj interného
      # Shoptet id (CSV vyššie ho nenesie). Rovnaká úvaha ako SHOPTET_ORDERS_URL:
      # `.optional()` v `env.ts`, bare kľúč preberá `/srv/forestshop/.env`, keď
      # tam je; keď nie je, appka beží ďalej, odkaz na objednávku len padá
      # späť na vyhľadávanie.
      SHOPTET_ORDERS_XML_URL:
      ORDERS_RAW_DIR: /data/orders-raw
      # issue 65: priamy odkaz do Shoptet administrácie pri riadku objednávky
      # — NA ROZDIEL od SHOPTET_EXPORT_URL/SHOPTET_ORDERS_URL vyššie toto
      # NIE JE tajomstvo (žiadny prihlasovací `hash`) a `env.ts`'s zod schéma
      # má rozumný `.default(...)`, takže appka funguje aj bez tohto riadku
      # v `/srv/forestshop/.env` — bare kľúč tu je len na to, aby sa dala
      # doména zmeniť BEZ nového deploy/buildu, keby to niekedy bolo treba.
      SHOPTET_ADMIN_BASE_URL:
      # Odosielanie objednávky dodávateľovi mailom (#31) — rovnaká úvaha ako
      # SHOPTET_EXPORT_URL vyššie: `.optional()` v `env.ts`, bare kľúč
      # preberá `/srv/forestshop/.env`, keď tam je; keď nie je, appka beží
      # ďalej, len odoslanie mailom vráti 503.
      MAIL_HOST:
      MAIL_PORT:
      MAIL_USER:
      MAIL_PASS:
      MAIL_FROM:
    volumes:
      - catalog-raw:/data/catalog-raw
      - orders-raw:/data/orders-raw
    ports:
      - "127.0.0.1:8901:3000"
    logging: *default-logging

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN:?chyba CF_TUNNEL_TOKEN}
    depends_on: [app]
    logging: *default-logging

volumes:
  pgdata:
  catalog-raw:
  orders-raw:
