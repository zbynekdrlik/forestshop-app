x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: forestshop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?chyba POSTGRES_PASSWORD}
      POSTGRES_DB: forestshop
      # postgres:18+ images default PGDATA to /var/lib/postgresql/<major>/docker;
      # pin it back to the classic single-mount path so the named volume below works
      # (rovnaký dôvod ako v docker-compose.yml pre lokálny vývoj).
      PGDATA: /var/lib/postgresql/data
    volumes:
      # Rovnaký dôvod ako v `docker-compose.yml` (issue 209): obraz deklaruje
      # `/var/lib/postgresql` ako VOLUME, `pgdata` nižšie pokrýva len jeho
      # podpriečinok `data`, takže bez tohto riadku docker pri každom
      # prestavaní kontajnera zanechá ďalšiu bezmennú priehradku. Zmerané na
      # dev2: presne jedna taká 4 KB priehradka bola naša, zvyšok patril inému
      # projektu. Skutočné dáta zostávajú v `pgdata` — `pgparent` je prázdny
      # obal a jeho pridanie NEPRESÚVA existujúcu databázu (overené lokálne
      # na odhodenom kontajneri: zápis pred zmenou prežil prestavanie).
      - pgparent:/var/lib/postgresql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forestshop"]
      interval: 10s
      timeout: 3s
      retries: 20
    logging: *default-logging

  app:
    image: ghcr.io/zbynekdrlik/forestshop-app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # issue 313 (vedľajší nález, nie hlavná oprava tiketu): appka bez tohto
    # bola PID 1 vo vlastnom kontajneri, bez skutočného init procesu —
    # `apps/api/src/shutdown.ts`'s SIGTERM handler (issue 78) to rieši pre
    # appku samotnú, ale osirelé Playwright/Chromium potomkovia (zombie `Z`
    # procesy po KAŽDOM `browser.close()`) sa bez init procesu nikdy
    # nezožnú — naživo overené na produkcii (desiatky nazbieraných zombie
    # procesov pod appka PID 1). `init: true` necháva Docker vložiť
    # zabudovaný `tini` ako PID 1 namiesto appky (appka je odvtedy PID 2+,
    # nič iné sa nemení) — štandardná, dokumentovaná Docker oprava presne
    # pre túto triedu problému. Naživo overené ako neškodné (appka nabehla
    # aj po tejto zmene identicky) — NEBOLO to však samo osebe dosť na
    # opravu tohto tiketu (skutočná príčina a oprava: `.claude/rules/
    # shoptet-writeback.md`'s izolovaný dieťa proces).
    init: true
    # Doplnok k appka's vlastnému SIGTERM handleru (apps/api/src/shutdown.ts,
    # issue 78) — appka sa dnes ukončí za pár ms, ale 15s dáva rezervu pre
    # prípad pomalšieho zatvárania DB spojení pod záťažou. Toto NIE JE
    # náhrada za handler: appka bez neho SIGTERM ignorovala úplne (PID 1 bez
    # init procesu) a čakala by celých 15s pri KAŽDOM deployi namiesto pár ms.
    stop_grace_period: 15s
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://forestshop:${POSTGRES_PASSWORD}@postgres:5432/forestshop
      PORT: 3000
      SESSION_COOKIE_SECURE: "true"
      # issue 293: kontajner predtým bežal bez nastaveného pásma (teda v
      # UTC), takže naplánované úlohy behali o 1-2 hodiny neskôr, než
      # majiteľ nastavil. `Dockerfile` má TÚ ISTÚ hodnotu ako baked-in
      # predvolenú (`ENV TZ=Europe/Bratislava`) — tento riadok ju len robí
      # explicitnou/prepísateľnou tu, rovnaká disciplína ako každá iná
      # premenná v tomto bloku.
      TZ: Europe/Bratislava
      # Zámerne BEZ `:?` (na rozdiel od POSTGRES_PASSWORD/CF_TUNNEL_TOKEN nižšie) —
      # `env.ts` (F0) má SHOPTET_EXPORT_URL ako `.optional()`, appka bez neho beží,
      # len ručný import vráti 503. Bare kľúč preberá hodnotu z `/srv/forestshop/.env`,
      # KEĎ tam je; keď nie je (dnešný stav dev2), premenná sa v kontajneri vôbec
      # nenastaví — nie prázdny reťazec, ktorý by `z.string().url()` odmietol a appku
      # zhodil pri štarte. Povinný `:?` by tu pri každom deployi na dev2 padal, kým
      # operátor tajomstvo nedoplní (issue #8).
      SHOPTET_EXPORT_URL:
      CATALOG_RAW_DIR: /data/catalog-raw
      # Rovnaká úvaha ako SHOPTET_EXPORT_URL vyššie — `.optional()` v `env.ts`
      # (#21), bare kľúč preberá `/srv/forestshop/.env`, keď tam je.
      SHOPTET_ORDERS_URL:
      # issue 120: SAMOSTATNÝ XML export objednávok — jediný zdroj interného
      # Shoptet id (CSV vyššie ho nenesie). Rovnaká úvaha ako SHOPTET_ORDERS_URL:
      # `.optional()` v `env.ts`, bare kľúč preberá `/srv/forestshop/.env`, keď
      # tam je; keď nie je, appka beží ďalej, odkaz na objednávku len padá
      # späť na vyhľadávanie.
      SHOPTET_ORDERS_XML_URL:
      ORDERS_RAW_DIR: /data/orders-raw
      # issue 65: priamy odkaz do Shoptet administrácie pri riadku objednávky
      # — NA ROZDIEL od SHOPTET_EXPORT_URL/SHOPTET_ORDERS_URL vyššie toto
      # NIE JE tajomstvo (žiadny prihlasovací `hash`) a `env.ts`'s zod schéma
      # má rozumný `.default(...)`, takže appka funguje aj bez tohto riadku
      # v `/srv/forestshop/.env` — bare kľúč tu je len na to, aby sa dala
      # doména zmeniť BEZ nového deploy/buildu, keby to niekedy bolo treba.
      SHOPTET_ADMIN_BASE_URL:
      # issue 122: spätný zápis odkazu na dodávateľa do Shoptetu cez hromadný
      # CSV import (Playwright) — rovnaká úvaha ako SHOPTET_EXPORT_URL vyššie:
      # `.optional()` v `env.ts`, bare kľúč preberá `/srv/forestshop/.env`,
      # keď tam je; keď nie je, appka beží ďalej, len naplánovaná úloha
      # zaznamená "nenakonfigurované" (nikdy sa netýka manuálneho HTTP
      # requestu, na rozdiel od SHOPTET_EXPORT_URL). Skutočné prihlasovacie
      # údaje — nikdy natvrdo, nikdy do repa.
      SHOPTET_ADMIN_USER:
      SHOPTET_ADMIN_PASSWORD:
      # issue 292: DPD portál (dpdshipper.sk) prihlásenie — rovnaká úvaha ako
      # SHOPTET_ADMIN_USER/PASSWORD vyššie: `.optional()` v `env.ts`, bare
      # kľúč preberá `/srv/forestshop/.env`, keď tam je; keď nie je, appka
      # beží ďalej, "Preprava DPD" hlási nenakonfigurované namiesto pádu.
      # Nájdené AŽ pri post-deploy overení PR 324 — tento riadok chýbal od
      # F1 (schéma/UI bez neho nasadené skôr), rovnaká trieda medzery ako
      # `.claude/rules/deploy.md`'s zdokumentovaný issue 198 nález
      # (MAIL_BCC/NEDOSTUPNE_BCC_EMAIL).
      DPD_PORTAL_USER:
      DPD_PORTAL_PASSWORD:
      # `env.ts` má rozumný `.default(...)` — bare kľúč tu je len na to, aby
      # sa dala adresa portálu zmeniť BEZ nového deploy/buildu (rovnaký
      # dôvod ako SHOPTET_ADMIN_BASE_URL vyššie).
      DPD_PORTAL_BASE_URL:
      # Alpine (base image) nemá Playwright's vlastný stiahnutý Chromium —
      # `Dockerfile` inštaluje systémový `apk add chromium` a
      # `playwright-import.ts`'s `resolveChromiumExecutablePath` ho nájde
      # automaticky (pevné cesty `/usr/bin/chromium-browser`/`/usr/bin/chromium`),
      # tento riadok je len núdzový override, keby sa cesta niekedy zmenila.
      CHROMIUM_EXECUTABLE_PATH:
      # Odosielanie objednávky dodávateľovi mailom (#31) — rovnaká úvaha ako
      # SHOPTET_EXPORT_URL vyššie: `.optional()` v `env.ts`, bare kľúč
      # preberá `/srv/forestshop/.env`, keď tam je; keď nie je, appka beží
      # ďalej, len odoslanie mailom vráti 503.
      MAIL_HOST:
      MAIL_PORT:
      MAIL_USER:
      MAIL_PASS:
      MAIL_FROM:
      # Skrytá kópia (BCC) na KAŽDOM maile dodávateľovi z obrazovky "Na
      # objednanie". Majiteľ 3. 8. 2026: "vsade zatial ma byt ked nieco
      # posiela mail dokial sa to neosvedci ze to funguje dobre" — chýbal
      # tu, hoci `env.ts` ho číta, takže sa do kontajnera vôbec nedostal.
      MAIL_BCC:
      # issue 176: "Nedostupné tovary" — skrytá kópia (BCC) majiteľovi.
      # Rovnaká úvaha aj rovnaký fail-closed kontrakt ako pri dvoch
      # premenných nižšie; chýbal v tomto zozname, takže hodnota z
      # `/srv/forestshop/.env` sa do kontajnera nikdy nedostala a obrazovka
      # hlásila "Chýba adresa pre skrytú kópiu majiteľovi".
      NEDOSTUPNE_BCC_EMAIL:
      # issue 172: "Nevyzdvihnuté zásielky" — skrytá kópia (BCC) majiteľovi,
      # rovnaká úvaha ako MAIL_HOST vyššie (`.optional()` v env.ts, bare
      # kľúč). Chýbajúca = automatizácia NEPOŠLE ani jeden e-mail zákazníkovi
      # (fail-closed, ticket's jediná bezpečnostná podmienka) — appka beží
      # ďalej, len viditeľne to nahlási na obrazovke.
      POSTA_UNCOLLECTED_BCC_EMAIL:
      # issue 173: "Pripomienky objednávok" — OpenAI klasifikátor internej
      # poznámky predajne. Rovnaká úvaha ako MAIL_HOST vyššie (`.optional()`
      # v env.ts, bare kľúč). Chýbajúci = objednávky s poznámkou zostanú
      # "čaká" (AI nedostupné), appka beží ďalej, nikdy nehádaj/nepošli naslepo.
      OPENAI_API_KEY:
      # issue 173: skrytá kópia (BCC) majiteľovi — NEZÁVISLÁ, vyhradená
      # premenná (rovnaký dôvod ako POSTA_UNCOLLECTED_BCC_EMAIL vyššie).
      # Chýbajúca = automatizácia NEPOŠLE ani jeden e-mail zákazníkovi
      # (fail-closed, majiteľova jediná bezpečnostná podmienka).
      ORDER_REMINDER_BCC_EMAIL:
      # issue 257: "Zlúčenie objednávok" — skrytá kópia (BCC) majiteľovi,
      # NEZÁVISLÁ vyhradená premenná (rovnaký dôvod ako ostatné *_BCC_EMAIL
      # vyššie). Chýbajúca = automatizácia NEPOŠLE ani jeden e-mail
      # zákazníkovi (fail-closed).
      ORDER_MERGE_BCC_EMAIL:
      # issue 309: "Eshop → Upozornenia" — najbližšia udalosť z majiteľovho
      # Google kalendára. Rovnaká úvaha ako SHOPTET_EXPORT_URL vyššie:
      # `.optional()` v `env.ts`, bare kľúč preberá `/srv/forestshop/.env`,
      # keď tam je; keď nie je, appka beží ďalej, karta na nástenke sa
      # jednoducho nezobrazí. Adresa je CELÁ tajomstvo (tajný token je
      # priamo v CESTE, nie len v query parametri) — sem patrí LEN bare
      # kľúč, nikdy skutočná hodnota.
      GOOGLE_CALENDAR_ICS_URL:
    volumes:
      - catalog-raw:/data/catalog-raw
      - orders-raw:/data/orders-raw
    ports:
      - "127.0.0.1:8901:3000"
    logging: *default-logging

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # issue 357: cloudflared sa predvolene pripája protokolom QUIC (UDP 7844).
    # Na sieti dev2 QUIC handshake prestal prechádzať ("failed to dial to edge
    # with quic: timeout") na VŠETKÝCH štyroch spojeniach súčasne -> tunel
    # nemal ani jedno živé spojenie -> Cloudflare Error 1033 / HTTP 530 na
    # oboch verejných adresách (výpadok 12. 8. 2026 ráno). `--protocol http2`
    # núti tunel ísť po TCP 443 namiesto UDP — bezpečná voľba bez ohľadu na
    # to, či bol QUIC výpadok dočasný alebo trvalý. Bez tohto riadku by
    # KAŽDÉ ďalšie nasadenie (deploy.yml kopíruje tento súbor na dev2)
    # potichu vrátilo QUIC a výpadok sa zopakuje.
    command: tunnel --no-autoupdate --protocol http2 run --token ${CF_TUNNEL_TOKEN:?chyba CF_TUNNEL_TOKEN}
    depends_on: [app]
    logging: *default-logging

volumes:
  pgparent:
  pgdata:
  catalog-raw:
  orders-raw:
