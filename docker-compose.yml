services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: forestshop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forestshop}
      POSTGRES_DB: forestshop
      # postgres:18+ images default PGDATA to /var/lib/postgresql/<major>/docker;
      # pin it back to the classic single-mount path so the named volume below works.
      PGDATA: /var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forestshop"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
