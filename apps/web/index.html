<!doctype html>
<html lang="sk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- issue 430: favicon = sidebar značka appky (🌲 na --fs-brand štvorci).
         SVG je primárny (škáluje), .ico je legacy fallback + odpoveď na
         predvolený /favicon.ico dopyt (aby nevracal SPA index.html), PNG
         varianty pre prehliadače bez SVG a apple-touch pre iOS. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- issue 437: PWA — Štěpán si „appku" (Poznámky) pridá na plochu telefónu
         a otvorí sa mu rovno stránka Poznámky (`start_url: /?tab=poznamky`,
         `display: standalone`). `theme-color`/`apple-*` metá + `manifest`
         znovupoužívajú značku 🌲 z favicon sady #430 (`icon-192/512.png`). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#26543a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Poznámky" />
    <title>Forestshop</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
