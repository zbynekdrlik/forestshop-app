name: Deploy

on:
  push:
    branches: [main]

# Two quick merges to main can otherwise run two deploy jobs concurrently, and a
# `docker compose pull` + `up -d` from the OLDER run finishing last would overwrite
# the newer image on the target server. Never cancel a deploy mid-flight
# (cancel-in-progress: false) — queue instead, so every push still gets fully
# deployed, in order.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # issue #5 (closed 2026-08-03): parovanie_produktov, the older sibling
  # project that used to serve this hostname, was retired by its owner and
  # forestshop.newlevel.media now belongs to this app — verified live
  # (Cloudflare tunnel ingress + DNS CNAME both point here). See issue 366
  # for the re-verification done when the deploy target moved off dev2.
  # forestshop-novy.newlevel.media still resolves to the same app on the
  # same tunnel and is kept working as a fallback address.
  LIVE_HOSTNAME: forestshop.newlevel.media

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # Bez tohto kroku buildx použije predvolený builder s driverom `docker`
      # (naviazaný na lokálny daemon runnera), ktorý nevie nahrať obraz do
      # registra PRIAMO počas zostavovania — najprv ho uloží do daemona a až
      # potom spustí samostatný `docker push`. Tento dvojkrokový spôsob je
      # zdokumentovane menej spoľahlivý pri viacvrstvových obrazoch a viacerých
      # tagoch naraz a bol príčinou `ERROR: failed to build: unknown blob` pri
      # nahrávaní na ghcr.io (run 30529745338, issue #42). Vlastný builder s
      # driverom `docker-container` nahráva natívnym BuildKit exportérom
      # jedným krokom (push=true priamo v build kroku).
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/zbynekdrlik/forestshop-app:${{ steps.meta.outputs.version }}
            ghcr.io/zbynekdrlik/forestshop-app:latest
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            APP_COMMIT=${{ github.sha }}

  deploy:
    needs: build
    # issue 366 (2026-08-12): production moved off dev2 onto a dedicated
    # Hetzner VPS (`forestshop-dev`, forestshop-dev.newlevel.media). Runner
    # `forestshop-dev-runner` is registered there (label `forestshop-dev`),
    # enabled as a systemd service so it survives a reboot. dev2's old
    # runner (`dev2-forestshop`, label `dev2`) is left registered but idle
    # as a rollback path — no workflow targets it anymore.
    runs-on: [self-hosted, forestshop-dev]
    env:
      # Pin pull + up to the version THIS run just built — never the mutable
      # `:latest` tag, which a second, faster deploy could repoint mid-flight.
      IMAGE_TAG: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Priprava súborov na serveri
        working-directory: /srv/forestshop
        run: |
          cp "$GITHUB_WORKSPACE/docker-compose.prod.yml" .
          # scripts/ (zálohovanie, obnovovací drill, deploy-verify.sh) musí byť na
          # serveri vždy presne to, čo je v repozitári — inak sa tichým opomenutím
          # rozíde od gitu naveky. Samotné nasadenie robí ďalší krok cez
          # deploy-verify.sh (volaný z $GITHUB_WORKSPACE checkoutu).
          mkdir -p scripts
          rsync -a --delete "$GITHUB_WORKSPACE/scripts/" scripts/
      - name: Nasadiť s overením a automatickým rollbackom
        # issue 425 (výpadok 13. 8. 2026): skript si PRED nasadením zapamätá tag
        # práve bežiaceho image, nasadí novú verziu (pull + up), overí
        # /api/version v retry slučke (12× 5 s — pomalý štart s migráciami nie je
        # zlyhanie), a pri zlyhaní AUTOMATICKY vráti predošlý image a overí
        # zotavenie. Logika je vyčlenená do skriptu, aby sa dala jednotkovo
        # testovať (scripts/deploy-verify.test.sh, beží v CI `check` jobe — CI
        # skutočný produkčný deploy odbehnúť nevie, túto logiku áno s mocknutým
        # docker/curl). Skript pri neúspechu novej verzie skončí NENULOVO — job
        # ostane červený (no-continue-on-error, rollback chybu neskryje) —, ale
        # produkcia beží ďalej na predošlej verzii.
        working-directory: /srv/forestshop
        # LIVE_HOSTNAME (workflow env) aj IMAGE_TAG (job env) sú v rozsahu; retry
        # parametre (12× 5 s) sú defaulty v skripte. Skript parsuje /api/version
        # portable sed-om, takže tento krok už nepotrebuje `node` na runneri.
        run: bash "$GITHUB_WORKSPACE/scripts/deploy-verify.sh"
      - name: Upratať staršie obrazy TEJTO appky
        # issue 206: forestshop-dev je zdieľaný stroj — jeden náš obraz má
        # ~1,4 GB, takže každé nasadenie doteraz nechalo po sebe ďalší. Maže sa
        # VÝHRADNE `ghcr.io/<repo>` (naše vlastné obrazy) a nikdy ten práve
        # nasadený — cudzie projekty na tom istom stroji sa tým nikdy nedotkneme.
        # `|| true` je tu zámerne: obraz môže držať ešte dobiehajúci starý
        # kontajner a nasadenie je v tej chvíli už hotové a overené — neuprataný
        # obraz nesmie zhodiť úspešný deploy.
        #
        # issue 425: tento krok beží AŽ ZA overením/rollbackom (predtým bol PRED
        # ním). GitHub Actions po zlyhanom kroku ďalšie kroky preskočí, takže pri
        # neúspešnom deployi (rollback) sa upratovanie NEspustí a predošlý image
        # ostane lokálne k dispozícii pre rollback. Keby upratovanie bežalo pred
        # overením ako predtým, zmazalo by práve ten image, na ktorý rollback
        # potrebuje siahnuť.
        run: |
          keep="ghcr.io/${GITHUB_REPOSITORY,,}:${IMAGE_TAG}"
          docker images --format '{{.Repository}}:{{.Tag}}' \
            | grep "^ghcr.io/${GITHUB_REPOSITORY,,}:" \
            | grep -v "^${keep}$" \
            | xargs -r -n1 docker rmi || true
          df -h / | tail -1
