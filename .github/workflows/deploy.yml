name: Deploy

on:
  push:
    branches: [main]

# Two quick merges to main can otherwise run two deploy jobs concurrently, and a
# `docker compose pull` + `up -d` from the OLDER run finishing last would overwrite
# the newer image on dev2. Never cancel a deploy mid-flight (cancel-in-progress:
# false) — queue instead, so every push still gets fully deployed, in order.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # Temporary public hostname while forestshop.newlevel.media still serves the
  # older sibling project (parovanie_produktov) — decision pending issue #5.
  # Switching to the final hostname later is a one-line change here.
  LIVE_HOSTNAME: forestshop-novy.newlevel.media

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # Bez tohto kroku buildx použije predvolený builder s driverom `docker`
      # (naviazaný na lokálny daemon runnera), ktorý nevie nahrať obraz do
      # registra PRIAMO počas zostavovania — najprv ho uloží do daemona a až
      # potom spustí samostatný `docker push`. Tento dvojkrokový spôsob je
      # zdokumentovane menej spoľahlivý pri viacvrstvových obrazoch a viacerých
      # tagoch naraz a bol príčinou `ERROR: failed to build: unknown blob` pri
      # nahrávaní na ghcr.io (run 30529745338, issue #42). Vlastný builder s
      # driverom `docker-container` nahráva natívnym BuildKit exportérom
      # jedným krokom (push=true priamo v build kroku).
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/zbynekdrlik/forestshop-app:${{ steps.meta.outputs.version }}
            ghcr.io/zbynekdrlik/forestshop-app:latest
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            APP_COMMIT=${{ github.sha }}

  deploy:
    needs: build
    runs-on: [self-hosted, dev2]
    env:
      # Pin pull + up to the version THIS run just built — never the mutable
      # `:latest` tag, which a second, faster deploy could repoint mid-flight.
      IMAGE_TAG: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Nasadiť (migrácie si aplikácia spustí sama pri štarte)
        working-directory: /srv/forestshop
        run: |
          cp "$GITHUB_WORKSPACE/docker-compose.prod.yml" .
          # scripts/ (zálohovanie, obnovovací drill) musí byť na dev2 vždy presne to,
          # čo je v repozitári — inak sa tichým opomenutím rozíde od gitu naveky.
          mkdir -p scripts
          rsync -a --delete "$GITHUB_WORKSPACE/scripts/" scripts/
          docker compose -f docker-compose.prod.yml pull app
          docker compose -f docker-compose.prod.yml up -d
      - name: Upratať staršie obrazy TEJTO appky
        # issue 206: dev2 je zdieľaný stroj a bol na 100 % disku — jeden náš
        # obraz má ~1,4 GB, takže každé nasadenie doteraz nechalo po sebe
        # ďalší. Maže sa VÝHRADNE `ghcr.io/<repo>` (naše vlastné obrazy) a
        # nikdy ten práve nasadený — cudzie projekty na tom istom stroji sa
        # tým nikdy nedotkneme. `|| true` je tu zámerne: obraz môže držať
        # ešte dobiehajúci starý kontajner a nasadenie je v tej chvíli už
        # hotové a overené — neuprataný obraz nesmie zhodiť úspešný deploy.
        run: |
          keep="ghcr.io/${GITHUB_REPOSITORY,,}:${IMAGE_TAG}"
          docker images --format '{{.Repository}}:{{.Tag}}' \
            | grep "^ghcr.io/${GITHUB_REPOSITORY,,}:" \
            | grep -v "^${keep}$" \
            | xargs -r -n1 docker rmi || true
          df -h / | tail -1
      - name: Overiť verziu na živej stránke
        run: |
          sleep 5
          live=$(curl -fsS "https://${LIVE_HOSTNAME}/api/version" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          want=$(node -p "require('./package.json').version")
          echo "live=$live want=$want"
          [ "$live" = "$want" ] || { echo "::error::nasadená verzia $live sa nezhoduje s $want"; exit 1; }
