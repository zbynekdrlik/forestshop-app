name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: forestshop
          POSTGRES_PASSWORD: forestshop
          POSTGRES_DB: forestshop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forestshop" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://forestshop:forestshop@127.0.0.1:5432/forestshop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @forestshop/api db:migrate
      - run: pnpm --filter @forestshop/api test:integration

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: forestshop
          POSTGRES_PASSWORD: forestshop
          POSTGRES_DB: forestshop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forestshop" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://forestshop:forestshop@127.0.0.1:5432/forestshop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @forestshop/api db:migrate
      - run: pnpm --filter @forestshop/web exec playwright install --with-deps chromium
      - name: DIAGNOSTIC (temporary, will be removed) - probe exact webServer command in isolation
        working-directory: apps/web
        env:
          SESSION_COOKIE_SECURE: "false"
        run: |
          set -x
          (pnpm exec tsx ../../scripts/e2e-setup.ts && pnpm --filter @forestshop/api start) > /tmp/api-diag.log 2>&1 &
          API_PID=$!
          for i in $(seq 1 45); do
            if curl -sf -o /dev/null http://127.0.0.1:3000/api/version; then
              echo "READY after ${i}s"
              break
            fi
            sleep 1
          done
          echo "--- ss -tlnp ---"
          ss -tlnp || true
          echo "--- ps auxf ---"
          ps auxf || true
          echo "--- curl -v ---"
          curl -v http://127.0.0.1:3000/api/version || true
          echo "--- api-diag.log ---"
          cat /tmp/api-diag.log
          pkill -f "tsx src/index.ts" || true
          pkill -f "e2e-setup.ts" || true
          kill "$API_PID" 2>/dev/null || true
          wait "$API_PID" 2>/dev/null || true
      - run: pnpm --filter @forestshop/web e2e

  version-check:
    if: github.ref_name != 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verzia na dev musí byť vyššia než na main
        run: |
          dev_v=$(node -p "require('./package.json').version")
          git fetch origin main --quiet
          main_v=$(git show origin/main:package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" || echo "0.0.0")
          echo "dev=$dev_v main=$main_v"
          if [ "$dev_v" = "$main_v" ] || [ "$(printf '%s\n%s\n' "$main_v" "$dev_v" | sort -V | tail -1)" != "$dev_v" ]; then
            echo "::error::verzia na dev ($dev_v) musí byť vyššia než na main ($main_v)"
            exit 1
          fi
