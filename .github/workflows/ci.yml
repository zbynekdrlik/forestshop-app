name: CI

on:
  # issue 458: CI beží na PUSH do `dev` aj `main`. `pull_request` trigger je
  # ZÁMERNE VYNECHANÝ. Predtým bežal aj `pull_request`, takže jeden `dev→main`
  # PR spustil DVA behy nad tým istým head commitom (event=push + event=pull_
  # request) — súťažili o zdroje/runner sloty a jeden `e2e`/`integration`
  # zamrzol. Zlúčiť ich cez `concurrency` (zrušiť jeden) NEfunguje: zrušený beh
  # nechá CANCELLED check na tom istom head SHA, takže PR ostane natrvalo
  # UNSTABLE (checky push aj PR behu sedia na jednom SHA — overené naživo na
  # PR #459). Riešenie je duplikát NEVYTVORIŤ: push beh nad head commitom `dev`-u
  # reportuje checky priamo na PR (GitHub páruje checky podľa SHA, nie podľa
  # eventu), takže PR je CLEAN, všetky brány bežia, a keďže každá zmena na `dev`
  # ide cez `dev→main` PR (ktorého head je pushnutý dev commit), „brány
  # bezpodmienečne na každom push do dev aj main" (issue 351) ostáva splnené.
  push:
    branches: [main, dev]

concurrency:
  # Zruší PREDBEHNUTÝ (starší) beh tej istej vetvy pri rýchlych po sebe idúcich
  # pushoch — šetrí CI na už neaktuálnom commite. Cancel sa týka STARŠÍCH
  # commitov (nie head-u PR), takže PR head má vždy len svoj vlastný beh a
  # ostáva CLEAN. (`head_ref || ref_name`: head_ref je prázdny pri push evente
  # → padne na ref_name = názov vetvy; ponechané pre robustnosť, keby sa niekedy
  # znova pridal pull_request trigger.)
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # issue 425: bash-unit test rollback/verify logiky z scripts/deploy-verify.sh
      # (mockuje docker/curl cez PATH stuby — CI skutočný produkčný deploy
      # odbehnúť nevie, túto logiku áno). Beží pri každom push/PR.
      - run: pnpm test:deploy-script
      # issue 499: bash-unit test alertovacieho routingu z scripts/uptime-check.sh
      # (mockuje curl/python3/date cez PATH stuby) — overí per-incident
      # --dedup-key + machine-channel routing (doktrína analyze-not-ping).
      - run: pnpm test:uptime-script

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: forestshop
          POSTGRES_PASSWORD: forestshop
          POSTGRES_DB: forestshop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forestshop" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://forestshop:forestshop@127.0.0.1:5432/forestshop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @forestshop/api db:migrate
      # issue 122: shoptet-writeback's integration tests drive a REAL
      # Chromium (via `playwright`) against a local fixture server (never the
      # real Shoptet) — same install step apps/web's e2e job already uses.
      # issue 460: cacheujeme stiahnutý Chromium (~/.cache/ms-playwright), aby
      # ho `playwright install` nesťahoval pri KAŽDOM behu — hlavná príčina
      # ~19-min zamrznutia bol výpadok playwright CDN pri sťahovaní prehliadača
      # (beh 32279109468). Kľúč = OS + presná verzia Playwrightu (chromium build
      # je viazaný na verziu), takže cache sa invaliduje AŽ pri bumpe Playwrightu.
      # issue 462: na cache-HIT sa install-deps (apt) UŽ NESPÚŠŤA — runner je
      # čerstvá `ubuntu-latest` VM a cache obnoví len binárku prehliadača, nie
      # apt liby, takže systémové liby dáva image (má chromium deps). Tým apt
      # zmizne z hot path a jeho ~17-min freeze na zdieľanom runneri sa
      # eliminuje. `install --with-deps` beží LEN na MISS (bump/evikcia cache) a
      # má `timeout-minutes` poistku, aby transient CDN/apt hang zlyhal rýchlo a
      # červeno (žiadny continue-on-error). Job ostáva bezpodmienečný (issue
      # 351) — jediné `if:` je na MISS kroku, nie na jobe/checku.
      - name: Zistiť verziu Playwright
        id: pw
        run: echo "version=$(pnpm --filter @forestshop/api exec node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright prehliadačov
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}
      - name: Nainštalovať Playwright (prehliadač + systémové závislosti) — len na cache MISS
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: pnpm --filter @forestshop/api exec playwright install --with-deps chromium
      - run: pnpm --filter @forestshop/api test:integration

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: forestshop
          POSTGRES_PASSWORD: forestshop
          POSTGRES_DB: forestshop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forestshop" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://forestshop:forestshop@127.0.0.1:5432/forestshop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @forestshop/api db:migrate
      # issue 460: rovnaký Playwright browser cache ako v `integration` jobe.
      # `@forestshop/web` používa `@playwright/test` (rovnaká verzia 1.62.0 ako
      # `playwright` v api → rovnaký cache kľúč a zdieľaný ~/.cache/ms-playwright).
      # issue 462: na cache-HIT sa install-deps (apt) UŽ NESPÚŠŤA (viď komentár v
      # `integration` jobe) — MISS `--with-deps` má `timeout-minutes` poistku.
      - name: Zistiť verziu Playwright
        id: pw
        run: echo "version=$(pnpm --filter @forestshop/web exec node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright prehliadačov
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}
      - name: Nainštalovať Playwright (prehliadač + systémové závislosti) — len na cache MISS
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: pnpm --filter @forestshop/web exec playwright install --with-deps chromium
      - run: pnpm --filter @forestshop/web e2e

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zostaviť produkčný Docker obraz (deployment cesta musí prejsť pred mergom)
        run: docker build --build-arg APP_VERSION=ci --build-arg APP_COMMIT=${{ github.sha }} .

  version-check:
    if: github.ref_name != 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verzia na dev musí byť vyššia než na main
        run: |
          dev_v=$(node -p "require('./package.json').version")
          git fetch origin main --quiet
          main_v=$(git show origin/main:package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" || echo "0.0.0")
          echo "dev=$dev_v main=$main_v"
          # `sort -V` NIE je semver: predvydania radí NAD finálnu verziu
          # (0.2.0 < 0.2.0-dev.1), takže táto brána padala vždy, keď na main
          # zostala -dev verzia. Radenie robí knižnica semver (pinutá verzia),
          # ktorá pozná prednosť predvydaní; posledný riadok je najvyššia verzia.
          highest=$(npx --yes semver@7.6.3 "$main_v" "$dev_v" | tail -1)
          if [ "$dev_v" = "$main_v" ] || [ "$highest" != "$dev_v" ]; then
            echo "::error::verzia na dev ($dev_v) musí byť vyššia než na main ($main_v)"
            exit 1
          fi
